<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
  The bluntly mark — the owner's authorized favicon (FAVICON1-SOLID.svg from the
  canonical asset pack), used verbatim.

  It replaces a hand-drawn approximation: the previous icon traced the wave-form
  "n" as a stroked path set in a ring, which was a recreation of artwork that
  exists as a real asset. Paths here are the owner's own.

  Of the four supplied favicons, this is the one that survives a 16px tab.
  GMAILSTYLE1/2 embed base64 rasters and weigh 1.5MB and 1.4MB — unusable at any
  size. GRADIENT is 3x these bytes and its gradient is indistinguishable from
  flat below about 32px.

  Trade-off worth knowing: the mark is 1.64:1 inside a square artboard, so at
  16px it sits smaller in the tab than the old ringed version did, which filled
  the square. That is how the asset is drawn, and it is not edited here.
-->
