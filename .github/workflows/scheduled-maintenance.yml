name: Scheduled maintenance

# PRODUCTION SCHEDULING AUTHORITY.
#
# Celery beat was never deployed — worker and beat exist only in
# backend/docker-compose.yml, a development file. Production runs the Next.js
# frontend and the FastAPI service on Vercel and nothing else, so every periodic
# job, including PII retention, waited on a moderator pressing a button.
#
# This is the scheduler. It calls one authenticated endpoint per job; the
# endpoint runs the same service functions the manual admin routes run, claims
# the job's logical period with a row a unique index arbitrates, and records
# every execution.
#
# Why here rather than Vercel Cron: this project is on the hobby plan, which
# allows two cron entries at daily granularity. There are eight jobs across six
# cadences. Why not a Celery deployment: a persistent worker, a persistent beat
# and a Redis broker is three always-on services for a few seconds of work a
# day.
#
# TIMES ARE UTC. The product's cadences are Asia/Manila (UTC+8), so each
# expression is the Manila time minus eight hours, which lands on the PREVIOUS
# UTC day for every one of these:
#
#   Manila 03:00 -> 19:00 UTC     Manila 05:00 -> 21:00 UTC
#   Manila 04:00 -> 20:00 UTC     Manila 05:30 -> 21:30 UTC
#   Manila 04:30 -> 20:30 UTC     Manila 06:00 -> 22:00 UTC
#
# The two monthly jobs cannot be expressed directly: "the 1st at 02:00 Manila"
# is the LAST day of the previous month at 18:00 UTC, and cron has no "last
# day". They are triggered daily; the endpoint decides eligibility from the
# logical PERIOD, so an invocation on the 2nd still completes the month that
# was missed on the 1st, and every later call that month finds it done. Exact
# Manila semantics, and it survives a scheduler that skips a day.
#
# The Philippines has observed UTC+8 with no daylight saving since 1945, so
# these offsets do not drift.

on:
  schedule:
    - cron: "0 19 * * *"    # 03:00 Manila — PII retention
    - cron: "0 20 * * *"    # 04:00 Manila — Wilson + product ratings
    - cron: "30 20 * * *"   # 04:30 Manila — trust progression
    - cron: "0 21 * * *"    # 05:00 Manila — contract sweep
    - cron: "30 21 * * *"   # 05:30 Manila — request expiry
    - cron: "0 22 * * *"    # 06:00 Manila — payout batch refresh
    - cron: "0 18 * * *"    # 02:00 Manila on the 1st — guarded in the endpoint
    - cron: "30 18 * * *"   # 02:30 Manila on the 5th — guarded in the endpoint
  workflow_dispatch:
    inputs:
      task:
        description: "Run one task now (must be in the endpoint's allow-list)"
        required: true
        type: choice
        options:
          - pii_retention
          - recompute_wilson_scores
          - recompute_all_trust
          - sweep_contracts
          - expire_requests
          - refresh_payout_batches
          - honesty_fund_distribution
          - schedule_payouts

concurrency:
  # One maintenance run at a time. The endpoint's period claim is the real
  # guard — this only avoids piling workflows up.
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Run due maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select the task for this trigger
        id: pick
        env:
          CRON: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.task }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "task=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$CRON" in
            "0 19 * * *")  task=pii_retention ;;
            "0 20 * * *")  task=recompute_wilson_scores ;;
            "30 20 * * *") task=recompute_all_trust ;;
            "0 21 * * *")  task=sweep_contracts ;;
            "30 21 * * *") task=expire_requests ;;
            "0 22 * * *")  task=refresh_payout_batches ;;
            "0 18 * * *")  task=honesty_fund_distribution ;;
            "30 18 * * *") task=schedule_payouts ;;
            *) echo "::error::No task mapped to schedule '$CRON'"; exit 1 ;;
          esac
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Invoke
        env:
          # The secret travels in a header, never a query string, so it cannot
          # reach an access log or a redirect target. It is never echoed.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: ${{ vars.PRODUCTION_BASE_URL || 'https://www.bluntly.ph' }}
          TASK: ${{ steps.pick.outputs.task }}
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured for this repository."
            exit 1
          fi

          # Two of the jobs recompute a whole population one record at a time
          # and cannot finish inside a single serverless request, so the API
          # answers `continuing` and we call again. The backend owns the cursor
          # entirely — nothing about position is sent from here, so this loop
          # cannot be used to steer or truncate a traversal.
          #
          # MAX_CALLS is a safety net, not the mechanism. Running out of calls
          # is NOT success: the period stays `continuing` with its cursor
          # intact, this job fails visibly, and the next scheduled run picks the
          # traversal up where it stopped. Nothing is marked complete.
          MAX_CALLS=200
          # `already_running` means another invocation holds the lease. Wait for
          # it rather than failing: overlapping schedules are normal and the
          # lease is short.
          MAX_BUSY_RETRIES=5
          BACKOFF=30

          call=0
          busy=0
          total=0

          while [ "$call" -lt "$MAX_CALLS" ]; do
            call=$((call + 1))
            code=$(curl -sS -o response.json -w "%{http_code}"                      -X POST "$BASE/api/v1/internal/cron/$TASK"                      -H "X-Cron-Key: $CRON_SECRET"                      -H "Content-Type: application/json"                      --max-time 300 --retry 2 --retry-delay 30 --retry-connrefused)

            # The body carries a task name, a status and counts. No payloads, no
            # identifiers, nothing sensitive — safe to print, and the only
            # record a reader of this log gets.
            echo "call $call -> HTTP $code"
            cat response.json || true
            echo

            case "$code" in
              200) ;;
              401|503) echo "::error::Scheduler credential rejected or unconfigured."; exit 1 ;;
              404) echo "::error::Task '$TASK' is not in the endpoint allow-list."; exit 1 ;;
              *)   echo "::error::Maintenance task '$TASK' failed with HTTP $code"; exit 1 ;;
            esac

            status=$(python3 -c "import json;print(json.load(open('response.json')).get('status',''))")
            batch=$(python3 -c "import json;print(json.load(open('response.json')).get('processed') or 0)")
            total=$((total + batch))

            case "$status" in
              ok)
                echo "::notice::$TASK completed after $call call(s), $total record(s)"
                exit 0 ;;
              skipped_not_due)
                echo "::notice::$TASK is not due yet; nothing to do."
                exit 0 ;;
              skipped_already_completed)
                echo "::notice::$TASK already completed this period."
                exit 0 ;;
              continuing)
                busy=0
                continue ;;
              skipped_already_running)
                busy=$((busy + 1))
                if [ "$busy" -gt "$MAX_BUSY_RETRIES" ]; then
                  echo "::error::$TASK still held after $busy attempts; giving up."
                  exit 1
                fi
                echo "another runner holds the lease; retrying in ${BACKOFF}s ($busy/$MAX_BUSY_RETRIES)"
                sleep "$BACKOFF"
                # Capped, so the doubling cannot outgrow the job's own
                # timeout-minutes: 30+60+120+120+120 is 7.5 minutes of waiting
                # at most, against a 20 minute budget. Uncapped it would reach
                # 15.5 minutes and the job would be killed mid-backoff, which
                # reads as an infrastructure failure rather than contention.
                BACKOFF=$((BACKOFF * 2))
                if [ "$BACKOFF" -gt 120 ]; then BACKOFF=120; fi
                continue ;;
              failed)
                echo "::error::$TASK reported failure"
                exit 1 ;;
              *)
                echo "::error::$TASK returned an unrecognised status '$status'"
                exit 1 ;;
            esac
          done

          # Out of calls. The period is still incomplete and must be visible as
          # such — the backend has NOT marked it done, and its cursor is intact.
          echo "::error::$TASK did not finish within $MAX_CALLS calls; period left incomplete and resumable"
          exit 1
