[project]
name = "bluntly-ph-backend"
version = "0.1.0"
description = "Bluntly.ph FastAPI backend — verified product & seller review platform"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI Depends() in defaults is idiomatic.
# UP042: we intentionally use (str, Enum) mixins, not StrEnum, for value serialization.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Manual smoke-test tool: a linear assertion checklist where long lines read fine.
"scripts/api_smoke.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
